  solari: xenon
  nas: carbon
  nas-x: carbon         # legacy alias (family devices know this)
  db: benzene           # -> iron once the ZimaBlade is reprovisioned
  n8n: amino
  hass: sodium
  grafana: quanta
  ntp: tachyon
  hole: helium
  hole2: mercury
