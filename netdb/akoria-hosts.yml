# =============================================================================
# Akoria network source-of-truth  (INTERIM)
# =============================================================================
# Authoritative record for host identity + DNS today. Deliberate stepping-stone:
# a generator renders everything downstream from it (BIND akoria.net + reverse
# zones, AD akoria.org reconciliation, Pi-hole forwarders). When the central
# MySQL DB lands it replaces THIS file behind the same generator, and the
# SolariNet dashboard becomes the CRUD front-end over it.
#
# Schema (mirrors the eventual DB tables):
#   hosts{} : name -> {ip, hw, role, status?}   # element/compound identity = A
#   ifaces{}: extra A records (a host's other NICs)
#   cnames{}: function -> host                   # functional alias = CNAME
#
# Rules: A = element/compound identity; CNAME = function; 2nd instance gets
# -alt/-secondary/-backup; 3+ enumerate (dns1/2/3, ns0-3).
# -----------------------------------------------------------------------------
domain:    akoria.net
ad_domain: akoria.org          # authoritative on radium (AD/BIND9_DLZ); mirrored hourly

hosts:
