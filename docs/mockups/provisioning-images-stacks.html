<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolariNet · Provisioning — Images &amp; Stacks (mockup)</title>
<!--
  MOCKUP ONLY. Static, self-contained, no build step, no network calls.
  All hosts, versions, dates and package names below are SAMPLE DATA.
  Design notes: docs/Provisioning_UI_Design.md
-->
<style>
:root{
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --r-sm:5px;--r-md:9px;--r-lg:14px;
}
[data-theme="dark"]{
  --bg:#05080e;--bg-deep:#03050a;--grid:rgba(34,184,240,.045);
  --panel:#0a121c;--panel-2:#0d1825;--panel-3:#122032;--panel-hi:#16273b;
  --line:#1b2c40;--line-2:#243a54;--line-glow:rgba(34,184,240,.22);
  --ink:#d8e6f4;--ink-dim:#8198b3;--ink-faint:#74879e;
  --teal:#22b8f0;--teal-deep:#1893c6;--violet:#8b6cff;
  --ok:#3dd68c;--ok-bg:rgba(47,230,160,.13);
  --warn:#ffb23d;--warn-bg:rgba(255,178,61,.13);
  --crit:#ff3d72;--crit-bg:rgba(255,61,114,.14);
  --shadow:0 10px 30px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14px}
button{font:inherit;color:inherit}
.wrap{position:relative;max-width:1360px;margin:0 auto;padding:16px;border-radius:var(--r-lg);overflow:hidden;color:var(--ink);background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}

/* dashboard primitives (mirrors dashboard/public/styles.css) */
.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);overflow:hidden}
.panel__head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel__head h3{margin:0;font-size:13px;font-weight:600;color:var(--ink-dim)}
.panel__head .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.panel__body{padding:16px}
.chip{min-height:32px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;background:var(--panel-2);color:var(--ink-dim);font-size:12.5px;cursor:pointer;user-select:none;font-weight:500}
.chip.on{color:var(--ink);border-color:var(--line-glow);background:var(--panel-hi)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--panel-3);color:var(--ink-dim);border:1px solid var(--line);white-space:nowrap}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.tag.crit{color:var(--crit);background:var(--crit-bg);border-color:transparent}
.tag.teal{color:var(--teal);border-color:var(--line-glow)}
.btn-primary{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border:1px solid var(--line-glow);border-radius:var(--r-md);background:var(--panel-hi);color:var(--teal);font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn-primary:hover{background:var(--teal-deep);color:#05080e}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;background:var(--panel-hi);color:var(--teal)}
.btn-ghost{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-md);background:transparent;color:var(--ink-dim);font-weight:500;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn-ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn-danger{color:var(--crit);border-color:rgba(255,61,114,.35)}
.btn-danger:hover{background:var(--crit);color:#05080e}
.muted{color:var(--ink-dim)} .faint{color:var(--ink-faint)}
.mono{font-family:var(--mono)}
.kicker{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint)}
input[type=text],select,textarea{background:rgba(255,255,255,.04);border:1px solid var(--line-2);border-radius:8px;color:inherit;font:inherit;font-size:13px;padding:8px 10px}
input[type=text]:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}

/* icon buttons */
.ib{width:32px;height:32px;display:inline-grid;place-items:center;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink-faint);cursor:pointer}
.ib:hover{border-color:var(--line-2);background:var(--panel-2);color:var(--ink)}
.ib.danger:hover{color:var(--crit);border-color:rgba(255,61,114,.35)}
.ib svg,.btn-primary svg,.btn-ghost svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
.top h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.mock-banner{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--warn)}

/* target band */
.target{display:grid;grid-template-columns:minmax(260px,1.1fr) 2fr auto;gap:18px;align-items:center}
.target .facts{display:flex;flex-wrap:wrap;gap:18px}
.fact .v{font-family:var(--mono);font-size:13px;margin-top:3px}
.mode{display:flex;gap:6px;flex-wrap:wrap}

/* columns */
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px;align-items:start}
@media (max-width:1050px){.cols{grid-template-columns:1fr}.target{grid-template-columns:1fr}}

/* images tree */
.distro{border-bottom:1px solid var(--line)}
.distro:last-child{border-bottom:0}
.distro>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none}
.distro>summary::-webkit-details-marker{display:none}
.distro>summary .chev{transition:transform .15s;color:var(--ink-faint)}
.distro[open]>summary .chev{transform:rotate(90deg)}
.distro>summary .name{font-weight:600}
.distro>summary .right{margin-left:auto;display:flex;gap:6px}
.release{padding:0 16px 10px 40px}
.release h4{margin:8px 0 6px;font-size:12px;font-weight:600;color:var(--ink-dim);display:flex;gap:8px;align-items:center}
.irow{display:grid;grid-template-columns:24px 92px 108px 1fr auto;gap:10px;align-items:center;padding:6px 8px;border:1px solid transparent;border-radius:9px}
.irow:hover{background:var(--panel-2)}
.irow.sel{border-color:var(--line-glow);background:var(--panel-hi)}
.irow.off{opacity:.38}
.irow.off .pick{pointer-events:none}
.irow .arch{font-family:var(--mono);font-size:12.5px}
.irow .meta{font-family:var(--mono);font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .acts{display:flex;gap:2px}
.pick{appearance:none;width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:50%;margin:0;cursor:pointer;display:grid;place-items:center}
.pick:checked{border-color:var(--teal)}
.pick:checked::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal)}

/* stacks */
.stack{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--line)}
.stack:last-child{border-bottom:0}
.stack .t{display:flex;gap:8px;align-items:center;font-weight:600}
.stack .d{font-size:12.5px;color:var(--ink-dim);margin-top:3px}
.stack .compat{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.stack .acts{display:flex;gap:2px}
.cb{appearance:none;width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:5px;margin:2px 0 0;cursor:pointer;display:grid;place-items:center}
.cb:checked{background:var(--teal);border-color:var(--teal)}
.cb:checked::after{content:"";width:9px;height:5px;border:2px solid #05080e;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.cb:disabled{cursor:not-allowed;opacity:.85}

/* deploy bar */
.dbar{position:sticky;bottom:0;margin:16px -16px -16px;background:rgba(5,8,14,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line-2);z-index:5}
.dbar .in{padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dbar .sum{font-family:var(--mono);font-size:12.5px;flex:1;min-width:280px}
.dbar .sum b{color:var(--ink);font-weight:600}
.dbar .warnline{font-size:11.5px;color:var(--warn);margin-top:3px}

/* drawer + modal */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none}
.scrim.on{display:block}
.drawer{position:absolute;right:16px;left:16px;margin-left:auto;max-width:760px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow);z-index:11;display:none;flex-direction:column}
.drawer.on{display:flex}
.drawer header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-size:16px}
.drawer .body{padding:16px 18px;overflow:auto;flex:1}
.drawer footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%}
table.items{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
table.items th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);padding:6px 6px;border-bottom:1px solid var(--line)}
table.items td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.items td input{width:100%;padding:5px 7px;font-family:var(--mono);font-size:12px}
table.items td.same{color:var(--ink-faint);font-family:var(--mono);font-size:11px}
.modal{position:absolute;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow);z-index:12;display:none}
.modal.on{display:block}
.modal .body{padding:18px}
.modal h2{margin:0 0 8px;font-size:16px}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.log{font-family:var(--mono);font-size:11.5px;line-height:1.6}
.log .row{display:grid;grid-template-columns:120px 1fr auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.log .row:last-child{border-bottom:0}
.note{font-size:11.5px;color:var(--ink-faint);margin-top:10px;line-height:1.5}
</style>
</head>

 dns:[
  {k:"bind",type:"pkg",suse:"bind",debian:"bind9",fedora:"bind"},
  {k:"zone helper",type:"role",suse:"role: dns-secondary (port pending)",debian:"role: dns-secondary",fedora:"—"}]
};
const LOG=[
 ["2026-10-31 05:02","apply  Core → xenon (dry-run)","ok"],
 ["2026-10-29 14:10","refresh openSUSE Tumbleweed x86_64 · sha256 verified","ok"],
 ["2026-07-05 09:41","stage  Debian 12 x86_64 + Core → test-vm-03","warn"]
];

/* ---------------- STATE ---------------- */
/* Selected stacks are pushed together as ONE run. Dependencies are pulled in
   automatically and the run is ordered dependencies-first. */
const S={target:"steel",mode:"reimage",image:"0.0.0",stacks:new Set(["core","web","ai"]),onlyCompat:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tgt=()=>TARGETS.find(t=>t.id===S.target);
const ico=(id)=>`<svg><use href="#i-${id}"/></svg>`;

function renderTarget(){
  $("#tsel").innerHTML=TARGETS.map(t=>`<option value="${t.id}"${t.id===S.target?" selected":""}>${esc(t.name)} — ${esc(t.model)}</option>`).join("");
  const t=tgt();
  const f=[["Arch",`<span class="tag teal">${t.arch}</span>`],["MAC",t.mac],["CPU",t.cpu],["Location",t.loc],["Current OS",t.os],["Disk",t.disk]];
  $("#tfacts").innerHTML=f.map(([k,v])=>`<div class="fact"><div class="kicker">${k}</div><div class="v">${k==="Arch"?v:esc(v)}</div></div>`).join("");
  const cls=t.agent==="ok"?"ok":t.agent.startsWith("stale")?"warn":"";
  $("#tstate").innerHTML=`<div class="kicker">Agent</div><div style="margin-top:4px"><span class="tag ${cls}">${esc(t.agent)}</span></div>`;
  document.querySelectorAll("[data-mode]").forEach(b=>{const on=b.dataset.mode===S.mode;b.classList.toggle("on",on);b.setAttribute("aria-checked",on)});
}

function renderImages(){
  const t=tgt();const host=$("#images");
  host.innerHTML=IMAGES.map((d,di)=>{
    const rels=d.releases.map((r,ri)=>{
      const rows=r.arches.map((a,ai)=>{
        const id=`${di}.${ri}.${ai}`;const compat=a.arch===t.arch;
        if(S.onlyCompat&&!compat)return"";
        const sum={ok:'<span class="tag ok">sha256 ✓</span>',stale:'<span class="tag warn">stale</span>',none:'<span class="tag">not fetched</span>'}[a.sum];
        const [bl,bc]=BOOT[a.boot];
        const off=!compat||S.mode==="apply";
        const why=!compat?`arch mismatch (target is ${t.arch})`:S.mode==="apply"?"not used in apply-only mode":"";
        return `<div class="irow${S.image===id?" sel":""}${off?" off":""}" title="${esc(why)}">
          <input class="pick" type="radio" name="img" value="${id}" aria-label="Select ${esc(d.distro)} ${esc(r.rel)} ${a.arch}"${S.image===id?" checked":""}${off||a.sum==="none"?" disabled":""}>
          <span class="arch">${a.arch}</span>
          <span><span class="tag ${bc}">${bl}</span></span>
          <span class="meta">v ${esc(a.ver)} · fetched ${esc(a.fetched)} ${sum}${a.unverified?' <span class="tag warn">netboot unverified</span>':""}</span>
          <span class="acts">
            <button class="ib" title="Refresh from upstream" aria-label="Refresh">${ico("refresh")}</button>
            <button class="ib" title="Edit source / install template" aria-label="Edit" data-open="image-edit" data-ref="${id}">${ico("edit")}</button>
            <button class="ib danger" title="Delete" aria-label="Delete" data-del="${esc(d.distro+" "+r.rel+" "+a.arch)}">${ico("trash")}</button>
          </span></div>`;}).join("");
      return rows?`<div class="release"><h4>${esc(r.rel)}${r.note?` <span class="tag">${r.note}</span>`:""}</h4>${rows}</div>`:"";
    }).join("");
    const n=d.releases.reduce((s,r)=>s+r.arches.filter(a=>a.arch===t.arch).length,0);
    return `<details class="distro" ${d.distro==="openSUSE"||d.distro==="Debian"?"open":""}>
      <summary><svg class="chev" width="14" height="14" style="stroke:currentColor;fill:none;stroke-width:2"><use href="#i-chev"/></svg>
        <span class="name">${esc(d.distro)}</span>
        <span class="right"><span class="tag">${d.releases.length} release${d.releases.length>1?"s":""}</span><span class="tag ${n?"teal":""}">${n} for ${t.arch}</span></span>
      </summary>${rels||'<div class="release faint" style="font-size:12px;padding-bottom:12px">No images for this architecture.</div>'}</details>`;
  }).join("");
}

function renderStacks(){
  const t=tgt();
  $("#stacks").innerHTML=STACKS.map(s=>{
    const auto=autoDeps().includes(s.id);const on=S.stacks.has(s.id)||auto||s.locked;
    const famTags=FAMS.map(f=>{const v=s.compat[f];return `<span class="tag ${v==="ok"?"ok":v==="warn"?"warn":"crit"}" title="${f}: ${v==="ok"?"all items mapped":v==="warn"?"some items unmapped/pending":"not supported"}">${f}</span>`}).join("");
    const archWarn=s.archNote&&t.arch==="riscv64"?`<span class="tag crit">${esc(s.archNote)}</span>`:"";
    return `<div class="stack">
      <input class="cb" type="checkbox" data-stack="${s.id}" aria-label="Include ${esc(s.name)}"${on?" checked":""}${s.locked||auto?" disabled":""}>
      <div>
        <div class="t">${esc(s.name)}${s.locked?` <span class="tag" title="Always included">${'<svg width="10" height="10" style="stroke:currentColor;fill:none;stroke-width:2;vertical-align:-1px"><use href="#i-lock"/></svg>'} always</span>`:""}
          ${s.deps.length?`<span class="tag">needs ${s.deps.join(", ")}</span>`:""}${auto&&!s.locked?'<span class="tag teal">auto · required by selection</span>':""}${s.upstream?'<span class="tag teal">upstream pins</span>':""}</div>
        <div class="d">${esc(s.desc)}</div>
        <div class="compat">${famTags}<span class="tag">${s.items} items</span>${archWarn}</div>
      </div>
      <div class="acts">
        <button class="ib" title="Edit stack" aria-label="Edit ${esc(s.name)}" data-open="stack-edit" data-ref="${s.id}">${ico("edit")}</button>
        ${s.locked?`<span class="ib" style="opacity:.25" title="Core cannot be deleted">${ico("trash")}</span>`:`<button class="ib danger" title="Delete" aria-label="Delete ${esc(s.name)}" data-del="stack ${esc(s.name)}">${ico("trash")}</button>`}
      </div></div>`;}).join("");
}

function closure(){const out=new Set();const visit=id=>{if(out.has(id))return;const s=STACKS.find(x=>x.id===id);s.deps.forEach(visit);out.add(id);};["core",...S.stacks].forEach(visit);return out;}
function ordered(){return [...closure()];}
function autoDeps(){const c=closure();return [...c].filter(id=>!S.stacks.has(id));}
function imgLabel(id){if(!id)return null;const [d,r,a]=id.split(".").map(Number);const D=IMAGES[d],R=D.releases[r],A=R.arches[a];return `${D.distro} ${R.rel} ${A.arch}`;}
function renderBar(){
  const t=tgt();const ord=ordered();const items=ord.reduce((n,id)=>n+STACKS.find(s=>s.id===id).items,0);
  const st=ord.map((id,i)=>`<span class="tag teal">${i+1}·${esc(STACKS.find(s=>s.id===id).name)}</span>`).join(" ")+` <span class="faint">(${ord.length} stacks · ${items} items · one run)</span>`;
  $("#stcount").textContent=`${ord.length} selected`;
  if(S.mode==="apply"){
    $("#dsum").innerHTML=`<b>${esc(t.name)}</b> ← apply ${st} <span class="faint">(no reimage, Ansible over SSH)</span>`;
    $("#dwarn").textContent=t.agent==="ok"?"":"Target agent is not healthy; apply needs SSH + sudo on the target.";
    $("#golabel").textContent="Deploy";$("#go").disabled=false;
  }else{
    const il=imgLabel(S.image);
    $("#dsum").innerHTML=`<b>${esc(t.name)}</b> ← ${il?`<b>${esc(il)}</b>`:'<span class="faint">select an image</span>'} + ${st}`;
    $("#dwarn").textContent=il?`Wipes ${t.disk} on next network boot. Staged per-MAC (${t.mac}); unstaged machines fall back to local disk.`:"";
    $("#golabel").textContent="Deploy";$("#go").disabled=!il;
  }
}
function renderLog(){$("#log").innerHTML=LOG.map(([w,m,s])=>`<div class="row"><span class="faint">${w}</span><span>${esc(m)}</span><span class="tag ${s}">${s}</span></div>`).join("");}
function all(){renderTarget();renderImages();renderStacks();renderBar();renderLog();}

/* ---------------- DRAWERS / MODAL ---------------- */
function openDrawer(kind,ref){
  let title="",body="";
  if(kind==="stack-edit"||kind==="stack-new"){
    const s=STACKS.find(x=>x.id===ref)||{name:"",desc:"",deps:["core"]};
    const rows=(ITEMS[ref]||[{k:"",type:"pkg",suse:"",debian:"",fedora:""}]).map(i=>`<tr>
      <td><input value="${esc(i.k)}" aria-label="Logical name"></td>
      <td><select aria-label="Type">${["pkg","upstream","role"].map(o=>`<option${o===i.type?" selected":""}>${o}</option>`).join("")}</select></td>
      ${FAMS.map(f=>i[f]==="="?`<td class="same" title="same as SUSE">= same</td>`:`<td><input value="${esc(i[f]||"")}" aria-label="${f} name"></td>`).join("")}
    </tr>`).join("");
    title=kind==="stack-new"?"New stack":`Edit stack · ${s.name}`;
    body=`<div class="grid2">
      <div class="field"><label class="kicker">Name</label><input type="text" value="${esc(s.name)}"></div>
      <div class="field"><label class="kicker">Depends on</label><input type="text" value="${esc(s.deps.join(", "))}"></div>
    </div>
    <div class="field" style="margin-top:12px"><label class="kicker">Description</label><input type="text" value="${esc(s.desc)}"></div>
    <div style="margin-top:18px;display:flex;align-items:center"><span class="kicker">Items · logical name → per-family package</span>
      <button class="btn-ghost" style="margin-left:auto;min-height:28px">${ico("plus")}Add item</button></div>
    <table class="items"><thead><tr><th style="width:22%">Logical</th><th style="width:13%">Type</th><th>SUSE</th><th>Debian / Ubuntu</th><th>Fedora</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="note"><b>pkg</b> = distro package (name per family; blank = unsupported there).
      <b>upstream</b> = installer/release outside the distro, pinned version, per-arch artifact + checksum.
      <b>role</b> = existing Ansible role. Stored in the SoR; rendered to Ansible vars at run time. No YAML is edited here.</div>`;
  }else{
    title=kind==="image-new"?"Add image":`Edit image · ${imgLabel(ref)}`;
    body=`<div class="grid2">
      <div class="field"><label class="kicker">Distro</label><select><option>openSUSE</option><option>Debian</option><option>Ubuntu</option><option>Fedora</option><option>Raspberry Pi OS</option></select></div>
      <div class="field"><label class="kicker">Release</label><input type="text" value="Tumbleweed"></div>
      <div class="field"><label class="kicker">Architecture</label><select><option>x86_64</option><option>arm64</option><option>armhf</option><option>riscv64</option><option>i386</option></select></div>
      <div class="field"><label class="kicker">Boot method</label><select><option>iPXE (kernel + initrd)</option><option>Pi netboot</option><option>Write to media</option></select></div>
    </div>
    <div class="field" style="margin-top:12px"><label class="kicker">Upstream source</label><input type="text" value="https://download.opensuse.org/tumbleweed/repo/oss/boot/x86_64/loader/"></div>
    <div class="field" style="margin-top:12px"><label class="kicker">Checksum source</label><input type="text" value="(signed CHECKSUMS / SHA256SUMS URL)"></div>
    <div class="grid2" style="margin-top:12px">
      <div class="field"><label class="kicker">Unattended template</label><select><option>opensuse.autoyast.xml.tmpl</option><option>debian.preseed.tmpl</option><option>ubuntu.autoinstall.tmpl</option></select></div>
      <div class="field"><label class="kicker">Refresh policy</label><select><option>Manual</option><option>Weekly (rolling)</option><option>On point release</option></select></div>
    </div>
    <div class="note">Refresh wraps the existing <span class="mono">fetch-images.sh</span> on benzene; artifacts land under <span class="mono">/srv/solari-provision/</span>; the boot menu is regenerated from this record.</div>`;
  }
  $("#dtitle").textContent=title;$("#dbody").innerHTML=body;
  $("#drawer").classList.add("on");$("#scrim").classList.add("on");place($("#drawer"),ANCHOR);
}
function confirmModal(title,html,word,onok){
  $("#mtitle").textContent=title;
  $("#mbody").innerHTML=html+`<div class="field" style="margin-top:12px"><label class="kicker">Type <span class="mono" style="color:var(--ink)">${esc(word)}</span> to confirm</label><input type="text" id="mword" autocomplete="off"></div>`;
  const ok=$("#mok");ok.disabled=true;ok.onclick=()=>{close();onok&&onok();};
  $("#modal").classList.add("on");$("#scrim").classList.add("on");place($("#modal"),ANCHOR);
  const w=$("#mword");w.oninput=()=>ok.disabled=w.value!==word;w.focus({preventScroll:true});
}
function place(el,anchor){
  const w=document.querySelector(".wrap").getBoundingClientRect();
  const a=(anchor||document.querySelector(".dbar")).getBoundingClientRect();
  el.style.top="0px";const h=el.offsetHeight;
  const y=Math.max(16,Math.min(a.top-w.top-40,w.height-h-16));
  el.style.top=y+"px";el.scrollIntoView({block:"nearest",behavior:"smooth"});
}
let ANCHOR=null;
function close(){$("#drawer").classList.remove("on");$("#modal").classList.remove("on");$("#scrim").classList.remove("on");}

/* ---------------- EVENTS ---------------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-close]");
  if(e.target.id==="scrim"||e.target.closest("[data-close]")){close();return;}
  if(!b)return;
  ANCHOR=b;
  if(b.dataset.mode){S.mode=b.dataset.mode;all();}
  else if(b.id==="onlyCompat"){S.onlyCompat=!S.onlyCompat;b.classList.toggle("on",S.onlyCompat);b.setAttribute("aria-pressed",S.onlyCompat);renderImages();}
  else if(b.dataset.open){openDrawer(b.dataset.open,b.dataset.ref);}
  else if(b.dataset.del){confirmModal(`Delete ${b.dataset.del}?`,"Removes the record and its staged artifacts. Hosts already installed from it are unaffected.","delete");}
  else if(b.id==="stall"){STACKS.forEach(x=>S.stacks.add(x.id));renderStacks();renderBar();}
  else if(b.id==="stnone"){S.stacks=new Set(["core"]);renderStacks();renderBar();}
  else if(b.id==="go"){const t=tgt();
    confirmModal(S.mode==="apply"?`Apply stacks to ${t.name}?`:`Stage reinstall of ${t.name}?`,
      (()=>{const l=ordered().map(id=>STACKS.find(s=>s.id===id).name).join(" → ");return S.mode==="apply"?`One Ansible run over SSH, in order: <b>${esc(l)}</b>. Dry-run diff first.`:`Stacks applied at first boot, in order: <b>${esc(l)}</b>.<br><br>`;})()+(S.mode==="apply"?"":`<b style="color:var(--warn)">Destructive.</b> ${esc(imgLabel(S.image))} will wipe <span class="mono">${esc(t.disk)}</span> on ${esc(t.name)}'s next network boot. Its node certificate is re-minted at first boot.`),
      t.name,()=>{LOG.unshift([new Date().toISOString().slice(0,16).replace("T"," "),`${S.mode==="apply"?"apply ":"stage "} ${S.mode==="apply"?"":imgLabel(S.image)+" + "}${ordered().join("+")} → ${t.name} (mock)`,"ok"]);renderLog();});}
});
document.addEventListener("change",e=>{
  if(e.target.id==="tsel"){S.target=e.target.value;S.image=null;all();}
  else if(e.target.name==="img"){S.image=e.target.value;renderImages();renderBar();}
  else if(e.target.dataset.stack){const id=e.target.dataset.stack;
    if(e.target.checked){S.stacks.add(id);}else{S.stacks.delete(id);}
    renderStacks();renderBar();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
all();
</script>
</body>
</html>
