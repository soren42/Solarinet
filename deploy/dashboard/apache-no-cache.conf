# Never let a browser or proxy reuse a response from this vhost. Safari's
# heuristic cache served hours-stale pages after deploys, and a validator would
# let an old copy live on through a 304, so validators are removed too.
#
# Install to /etc/apache2/solarinet-no-cache.conf and Include it inside each
# VirtualHost. Requires mod_headers.
FileETag None
RequestHeader unset If-None-Match
RequestHeader unset If-Modified-Since

# Static and PHP headers can sit in either the onsuccess or the always table;
# clear both so nothing leaks through and "always" does not produce a second,
# conflicting copy.
Header onsuccess unset ETag
Header always unset ETag
Header onsuccess unset Last-Modified
Header always unset Last-Modified
Header onsuccess unset Cache-Control
Header onsuccess unset Pragma
Header onsuccess unset Expires
Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
Header always set Pragma "no-cache"
Header always set Expires "0"
