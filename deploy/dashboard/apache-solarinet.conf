# SolariNet monitoring dashboard — Apache HTTPS vhost (intranet).
#
# Additive: pick a port not already used by other sites on the host (this
# template uses 9443). Serves the SPA statically from /var/www/solarinet and
# proxies the API to the SolariNet php-fpm pool (which runs as the repo owner so
# PHP can read the 0600 credential file and the operator's solariCtl socket).
#
# Install:
#   sudo a2enmod ssl proxy proxy_fcgi headers
#   sudo cp deploy/dashboard/apache-solarinet.conf /etc/apache2/sites-available/solarinet.conf
#   sudo a2ensite solarinet && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Adjust for your host: ServerName, the cert paths, the SCRIPT_FILENAME repo
# path, and the listen port.

Listen 9443
<VirtualHost *:9443>
    ServerName xenon
    DocumentRoot /var/www/solarinet

    SSLEngine on
    SSLCertificateFile    /etc/ssl/solarinet/dashboard.pem
    SSLCertificateKeyFile /etc/ssl/solarinet/dashboard.key

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    # API -> SolariNet php-fpm pool. The trailing slash in "^/api/" is REQUIRED:
    # "^/api" (no slash) also matches the SPA's own /api.jsx adapter file and
    # would route it to PHP, breaking the in-browser load.
    <LocationMatch "^/api/">
        SetHandler "proxy:unix:/run/php/solarinet-fpm.sock|fcgi://localhost"
        ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "/home/jason/Code/Solarinet/dashboard/api/index.php"
    </LocationMatch>

    <Directory /var/www/solarinet>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/solarinet_error.log
    CustomLog ${APACHE_LOG_DIR}/solarinet_access.log combined
</VirtualHost>
