# SolariNet monitoring dashboard.
#
# PRIMARY:  https://dashboard.akoria.net/  (alias https://solarinet.akoria.net/)
#           name-based HTTPS vhost on the standard :443, selected by SNI/Host so
#           it coexists with the akoria.net landing vhost on the same port.
# LEGACY:   https://xenon:9443/  — the original arbitrary-port vhost, kept as a
#           transitional fallback during the subdomain cutover. Safe to remove
#           once the subdomain (incl. OIDC/SSO login) is confirmed working.
#
# Static SPA from /var/www/solarinet; /api/* proxied to the SolariNet php-fpm
# pool (runs as jason for cred-file / solariCtl-socket access). Apache never
# touches the repo filesystem for API requests.

# ---- PRIMARY: subdomain on :443 (SNI name-based) ---------------------------
<VirtualHost *:443>
    ServerName  dashboard.akoria.net
    ServerAlias solarinet.akoria.net monitor.akoria.net solari.akoria.net
    DocumentRoot /var/www/solarinet

    SSLEngine on
    SSLCertificateFile    /etc/ssl/solarinet/dashboard.pem
    SSLCertificateKeyFile /etc/ssl/solarinet/dashboard.key

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    <LocationMatch "^/api/">
        SetHandler "proxy:unix:/run/php/solarinet-fpm.sock|fcgi://localhost"
        ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "/home/jason/Code/Solarinet/dashboard/api/index.php"
    </LocationMatch>

    <Directory /var/www/solarinet>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Files "sw.js">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Files>

    ErrorLog  ${APACHE_LOG_DIR}/solarinet_error.log
    CustomLog ${APACHE_LOG_DIR}/solarinet_access.log combined
</VirtualHost>

# ---- LEGACY: arbitrary port, transitional fallback -------------------------
# Remove this block (and the Listen) once the subdomain is confirmed end-to-end.
Listen 9443
<VirtualHost *:9443>
    ServerName xenon
    DocumentRoot /var/www/solarinet

    SSLEngine on
    SSLCertificateFile    /etc/ssl/solarinet/dashboard.pem
    SSLCertificateKeyFile /etc/ssl/solarinet/dashboard.key

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    <LocationMatch "^/api/">
        SetHandler "proxy:unix:/run/php/solarinet-fpm.sock|fcgi://localhost"
        ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "/home/jason/Code/Solarinet/dashboard/api/index.php"
    </LocationMatch>

    <Directory /var/www/solarinet>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Files "sw.js">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Files>

    ErrorLog  ${APACHE_LOG_DIR}/solarinet_error.log
    CustomLog ${APACHE_LOG_DIR}/solarinet_access.log combined
</VirtualHost>
