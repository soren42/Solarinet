# SolariNet monitoring dashboard.
#
# https://dashboard.akoria.net/  (alias https://solarinet.akoria.net/)
# Name-based (SNI) HTTPS vhost on the standard :443, selected by Host so it
# coexists with the akoria.net landing vhost on the same port.
#
# Static SPA and API come from the same immutable active release under
# /opt/solarinet/current; Apache never serves or writes a developer checkout.

<VirtualHost *:443>
    ServerName  dashboard.akoria.net
    ServerAlias solarinet.akoria.net monitor.akoria.net solari.akoria.net
    DocumentRoot /opt/solarinet/current/dashboard/public

    SSLEngine on
    SSLCertificateFile    /etc/ssl/solarinet/dashboard.pem
    SSLCertificateKeyFile /etc/ssl/solarinet/dashboard.key

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "no-referrer"
    Header always set Strict-Transport-Security "max-age=15552000"
    # RackWire's same-origin inventory scanner uses the camera; no other
    # browser permission is currently required by this dashboard origin.
    Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()"

    # Apply CSP to the main dashboard shell, not all static pages. The SPA's
    # no-build Babel runtime requires unsafe-eval and React style props require
    # unsafe-inline for styles; scripts themselves stay same-origin only.
    <LocationMatch "^/(?:index\.html)?$">
        Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-src 'self'"
    </LocationMatch>

    <LocationMatch "^/api/">
        SetHandler "proxy:unix:/run/php/solarinet85-fpm.sock|fcgi://localhost"
        ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "/opt/solarinet/current/dashboard/api/index.php"
    </LocationMatch>

    <Directory /opt/solarinet/releases>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Files "sw.js">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Files>

    ErrorLog  ${APACHE_LOG_DIR}/solarinet_error.log
    CustomLog ${APACHE_LOG_DIR}/solarinet_access.log combined
</VirtualHost>
