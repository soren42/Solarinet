; SolariNet dashboard php-fpm pool.
;
; Runs as the repo owner (not www-data) so PHP can read the 0600 credential file
; (solari-auth.json) and connect to the operator's solariCtl socket. The pool
; carries the dashboard's DB + path environment (clear_env strips everything else).
;
; Install (adjust the PHP version path to your host):
;   sudo cp deploy/dashboard/php-fpm-solarinet.conf /etc/php/8.4/fpm/pool.d/solarinet.conf
;   # set the real DB password (matches the 'solari' grant) below, then:
;   sudo chmod 0640 /etc/php/8.4/fpm/pool.d/solarinet.conf   # contains the secret
;   sudo php-fpm8.4 -t && sudo systemctl reload php8.4-fpm
;
; SECURITY: this file holds the DB password once filled in — keep it root:root 0640.

[solarinet]
user  = jason
group = jason

listen       = /run/php/solarinet-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm = dynamic
pm.max_children      = 8
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = yes
env[SOLARI_DB_HOST] = 127.0.0.1
env[SOLARI_DB_PORT] = 3306
env[SOLARI_DB_NAME] = solarinet
env[SOLARI_DB_USER] = solari
; Set this to the password granted to 'solari'@'127.0.0.1' (see run/db.env).
env[SOLARI_DB_PASS] = __REPLACE_WITH_SOLARI_DB_PASS__
env[SOLARI_CTL_SOCK]  = /home/jason/Code/Solarinet/run/solariCtl.sock
env[SOLARI_AUTH_FILE] = /home/jason/Code/Solarinet/solari-auth.json

php_admin_value[session.save_path]     = /home/jason/Code/Solarinet/run/sessions
php_admin_value[session.gc_maxlifetime] = 28800
php_admin_flag[display_errors]          = off
