# SolariNet PHP→host security boundary — system users & groups (Task #1).
#
# This is the FIRST half of the boundary: give the dashboard (PHP) its own uid
# that CANNOT read the CA key or the server runtime, and a shared group that
# lets it reach ONLY the solariCtl socket. The C peer-cred ACL is the second
# half; without this uid split PHP still runs as the server's own uid and every
# peer classifies as OPERATOR (the compat default).
#
# Install:
#   sudo cp solarinet-users.sysusers.conf /etc/sysusers.d/solarinet.conf
#   sudo systemd-sysusers            # creates the users/groups idempotently
#
# Resulting identities:
#   solari       — the SERVER service user. Sole holder of the CA key and DB
#                  password. Runs solarinet-server (and the in-process queue
#                  consumer that executes privileged verbs).
#   www-solari   — the DASHBOARD (php-fpm) user. Member of solari-ctl so it can
#                  connect() the socket; NOT able to read solari-owned secrets.
#   solari-ctl   — the group that owns the ctl socket (0660). Membership is the
#                  ONLY thing that grants a process the right to reach the bridge.
#
# Type Name        ID     GECOS                              Home            Shell
u      solari      -      "SolariNet server service"         /home/jason/Code/Solarinet  /usr/sbin/nologin
u      www-solari  -      "SolariNet dashboard (php-fpm)"    /nonexistent    /usr/sbin/nologin
g      solari-ctl  -      -
# www-solari joins solari-ctl to earn socket access; solari joins it too so the
# server (also a member) and the dashboard share the socket's group.
m      www-solari  solari-ctl
m      solari      solari-ctl
