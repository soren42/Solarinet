; SolariNet dashboard php-fpm pool — HARDENED (Task #1 PHP→host boundary).
;
; Differs from ../php-fpm-solarinet.conf in ONE decisive way: the pool runs as
; the dedicated `www-solari` uid, NOT the server's own uid. That uid cannot read
; the CA key or the server's DB password (see PERMISSIONS.md); it reaches the
; privileged control plane ONLY through the solariCtl socket, where the C
; peer-cred ACL classifies it as DASHBOARD and refuses every privileged verb.
; PHP must route SIGN/DEPLOY/RETIRE/… through REQUEST_SUBMIT instead.
;
; Prerequisites (in order):
;   1. /etc/sysusers.d/solarinet.conf applied (solari, www-solari, solari-ctl).
;   2. The server running as `solari` with [ctl] enforcePeer=true and
;      dashboardUid=www-solari, socketGid=solari-ctl (solarinet-server.service +
;      server.conf here).
;   3. File permissions per PERMISSIONS.md (CA key + server.env 0600 solari).
;
; Install (adjust the PHP version path to your host):
;   sudo cp php-fpm-solarinet.conf /etc/php/8.5/fpm/pool.d/solarinet.conf
;   # replace every __REPLACE_*__ value from the protected live config, then:
;   sudo chmod 0640 /etc/php/8.5/fpm/pool.d/solarinet.conf   # contains the secret
;   sudo php-fpm8.5 -t && sudo systemctl reload php8.5-fpm
;
; SECURITY: this file holds service credentials once filled in — keep it root:root 0640.

[solarinet]
; The boundary's uid split. www-solari is a member of solari-ctl (its only route
; to the socket) but owns none of the server's secrets.
user  = www-solari
group = www-solari

; The web server (Apache/nginx) talks to php-fpm over this socket. Unchanged.
listen       = /run/php/solarinet85-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm = dynamic
pm.max_children      = 8
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = yes
env[SOLARI_DB_HOST] = 127.0.0.1
env[SOLARI_DB_PORT] = 3306
env[SOLARI_DB_NAME] = solarinet
env[SOLARI_DB_CHARSET] = utf8mb4
; The dashboard uses a least-privilege DB user, not the server's `solari`
; account. Privileged host operations go through solariCtl; SoR reads/writes use
; the separate table-scoped account below.
env[SOLARI_DB_USER] = solari_dash
; Set this to the password granted to 'solari_dash'@'127.0.0.1'.
env[SOLARI_DB_PASS] = __REPLACE_WITH_SOLARI_DASH_DB_PASS__

; SoR-backed inventory, network allocation, DNS, and provisioning views.
; This is a separate, table-scoped account; provision it with
; hardened/sor-dashboard-grants.sql before the PHP-FPM cutover.
env[SOR_DB_HOST] = 10.1.0.200
env[SOR_DB_PORT] = 3306
env[SOR_DB_NAME] = sor
env[SOR_DB_USER] = solari_dashboard
env[SOR_DB_PASS] = __REPLACE_WITH_SOR_DB_PASS__

; The ONLY channel to the privileged host. The socket is 0660 root:solari-ctl;
; www-solari reaches it via group membership, and the kernel's SO_PEERCRED tells
; the server this peer is the dashboard uid → privileged verbs are refused here.
env[SOLARI_CTL_SOCK]  = /run/solari/solariCtl.sock

; The dashboard's OWN credential store (login users, bcrypt, OIDC, NFC). PHP
; reads AND writes this, so it lives on the web tier owned by www-solari — it is
; NOT a host secret. Kept distinct from the CA key, which www-solari cannot read.
env[SOLARI_AUTH_FILE] = /var/lib/solarinet-dashboard/solari-auth.json
env[SOLARI_UPLOAD_DIR] = /var/lib/solarinet-dashboard/uploads
env[SOLARI_AUTH_RATE_DIR] = /var/lib/solarinet-dashboard/auth-rate
env[SOLARI_FLEET_CATALOG] = /opt/solarinet/current/dashboard/api/fleet-catalog.json
; Public CA certificates only. Private signing keys stay solari-only.
env[SOLARINET_CA_PEM] = /var/lib/solarinet/pki/ca.pem
env[STEPCA_CA_FILE] = /var/lib/solarinet/pki/ca.pem

; Existing read-only Forgejo integration.
env[FORGEJO_URL] = http://10.1.0.200:3000
env[FORGEJO_TOKEN] = __REPLACE_WITH_FORGEJO_READ_TOKEN__

; Keycloak directory/MFA management integration.
env[KC_TOKEN_URL] = __REPLACE_WITH_KEYCLOAK_TOKEN_URL__
env[KC_ADMIN_URL] = __REPLACE_WITH_KEYCLOAK_ADMIN_URL__
env[KC_SVC_CLIENT] = __REPLACE_WITH_KEYCLOAK_SERVICE_CLIENT__
env[KC_SVC_SECRET] = __REPLACE_WITH_KEYCLOAK_SERVICE_SECRET__

; Certificate, DNS/RPZ, upload, and provisioning-catalog integrations.
env[STEPCA_URL] = https://10.7.0.10
env[SOLARI_RPZ_ZONE_FILE] = /etc/bind/zones/db.rpz.akoria
env[SOLARI_DNS_EXTERNAL] = 1.1.1.1

; Local login remains disabled when the dashboard uses Keycloak SSO.
env[SOLARI_LOCAL_LOGIN] = 0
; Optional overrides left unset unless the deployment needs them:
; SOLARI_DB_DSN, SOLARI_DB_SOCK, SOLARI_ALLOWED_ORIGINS.

php_admin_value[session.save_path]      = /var/lib/solarinet-dashboard/sessions
php_admin_value[session.gc_maxlifetime] = 28800
php_admin_flag[display_errors]          = off
; Defence in depth: PHP can only ever open paths under the dashboard tree, its
; own state dir, and the socket dir. Even a PHP RCE cannot read /home/... CA key.
php_admin_value[open_basedir] = /opt/solarinet/current:/opt/solarinet/releases:/var/lib/solarinet-dashboard:/var/lib/solarinet/pki/ca.pem:/etc/bind/zones/db.rpz.akoria:/run/solari:/tmp
