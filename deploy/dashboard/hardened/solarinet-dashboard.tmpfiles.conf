# SolariNet dashboard runtime/state dirs (Task #1 PHP→host boundary).
#
# Install:
#   sudo cp solarinet-dashboard.tmpfiles.conf /etc/tmpfiles.d/solarinet-dashboard.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/solarinet-dashboard.conf
#
# The dashboard's writable state (its own credential store + PHP sessions) lives
# here, owned by www-solari — NOT alongside the server's secrets. Keeping these
# off the server's home is what lets the CA key stay 0600 solari with no www-solari
# read path anywhere on the box.
#
# Type Path                                 Mode UID         GID         Age Arg
d      /var/lib/solarinet-dashboard         0750 www-solari  www-solari  -   -
d      /var/lib/solarinet-dashboard/sessions 0700 www-solari www-solari  -   -
# solari-auth.json is created by the deploy, not tmpfiles; assert its perms here
# so a bad umask cannot leave it group/world-readable.
z      /var/lib/solarinet-dashboard/solari-auth.json 0640 www-solari www-solari - -

# The server owns its own runtime dir (RuntimeDirectory=solari in the unit); this
# line only documents the expected ownership of the socket the dashboard reaches.
# The server chmods/chowns the socket itself on bind (0660 root:solari-ctl).
