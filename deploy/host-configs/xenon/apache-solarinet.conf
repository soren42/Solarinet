# SolariNet monitoring dashboard — additive HTTPS vhost on :9443 (intranet).
# Does not touch the host's existing :80/:443 sites. Static SPA from /var/www;
# /api proxied to the SolariNet php-fpm pool (runs as jason for cred/socket access).
Listen 9443
<VirtualHost *:9443>
    ServerName xenon
    DocumentRoot /var/www/solarinet

    SSLEngine on
    SSLCertificateFile    /etc/ssl/solarinet/dashboard.pem
    SSLCertificateKeyFile /etc/ssl/solarinet/dashboard.key

    # Security headers (intranet; relaxed CSP for the in-browser Babel transpile).
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    # API -> SolariNet php-fpm pool. All /api/* go to the root-owned web release;
    # PHP does not need to execute source from the writable development checkout.
    <LocationMatch "^/api/">
        SetHandler "proxy:unix:/run/php/solarinet85-fpm.sock|fcgi://localhost"
        ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "/var/www/solarinet/api/index.php"
    </LocationMatch>

    <Directory /var/www/solarinet>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/solarinet_error.log
    CustomLog ${APACHE_LOG_DIR}/solarinet_access.log combined
</VirtualHost>
