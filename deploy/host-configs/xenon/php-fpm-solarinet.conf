; SolariNet dashboard php-fpm pool — runs as 'jason' so PHP can read the 0600
; credential file and connect to the jason-owned solariCtl socket. Installed by
; the SolariNet deploy step; additive (does not touch other pools/sites).
[solarinet]
user = jason
group = jason
listen = /run/php/solarinet-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = yes
env[SOLARI_DB_HOST] = 127.0.0.1
env[SOLARI_DB_PORT] = 3306
env[SOLARI_DB_NAME] = solarinet
env[SOLARI_DB_USER] = solari
env[SOLARI_DB_PASS] = <REDACTED>
env[SOR_DB_HOST] = 10.1.0.200
env[SOR_DB_PORT] = 3306
env[SOR_DB_NAME] = sor
env[SOR_DB_USER] = solari
env[SOR_DB_PASS] = <REDACTED>
env[SOLARI_CTL_SOCK] = /home/jason/Code/Solarinet/run/solariCtl.sock
env[SOLARI_AUTH_FILE] = /home/jason/Code/Solarinet/solari-auth.json
php_admin_value[session.save_path] = /home/jason/Code/Solarinet/run/sessions
php_admin_value[session.gc_maxlifetime] = 28800
php_admin_flag[display_errors] = off
env[FORGEJO_URL] = http://10.1.0.200:3000
env[FORGEJO_TOKEN] = <REDACTED>
