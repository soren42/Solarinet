---
# Run per host by fleet-updates.py, which reads the SOLARI_UPDATE lines. A failed
# task is the failure report. This playbook never reboots a host.
#
# Every registered name belongs to one family: Ansible overwrites a registered
# name even when the task is skipped.
- name: Check or apply operating system package updates
  hosts: all
  gather_facts: false
  vars:
    solari_update_hold_restarts: false
  tasks:
    - name: Read the OS family
      ansible.builtin.setup:
        gather_subset: [min]

    - name: Report an unmanaged OS family
      ansible.builtin.debug:
        msg: "SOLARI_UPDATE SKIPPED OS family {{ ansible_facts['os_family'] }} is not managed by this playbook"
      when: ansible_facts['os_family'] not in ['Debian', 'Suse']

    - name: Stop on an unmanaged OS family
      ansible.builtin.meta: end_host
      when: ansible_facts['os_family'] not in ['Debian', 'Suse']

    - name: Debian family
      when: ansible_facts['os_family'] == 'Debian'
      block:
        - name: Refresh the package lists
          ansible.builtin.command: apt-get update
          changed_when: false
          failed_when: false

        - name: Simulate the upgrade
          ansible.builtin.command: apt-get -s dist-upgrade
          register: solari_apt_pending
          changed_when: false

        - name: Report pending packages
          ansible.builtin.debug:
            msg: >-
              SOLARI_UPDATE PENDING
              count={{ solari_apt_pending.stdout_lines | select('match', '^Inst \S+ \[') | list | length }}
              new={{ solari_apt_pending.stdout_lines | select('match', '^Inst \S+ \(') | list | length }}
              remove={{ solari_apt_pending.stdout_lines | select('match', '^Remv ') | list | length }}

        - name: Apply the upgrade
          ansible.builtin.apt:
            update_cache: false
            upgrade: dist
          environment:
            # needrestart must not restart the service that started this run.
            NEEDRESTART_SUSPEND: "{{ '1' if solari_update_hold_restarts | bool else '' }}"
          register: solari_apt_apply
          when: solari_update_mode == 'apply'

        - name: Look for the reboot marker
          ansible.builtin.stat:
            path: /run/reboot-required
          register: solari_apt_marker
          when: solari_update_mode == 'apply'

        # Plain Debian has no reboot marker, so also read what was installed.
        - name: Report the result
          ansible.builtin.debug:
            msg: >-
              SOLARI_UPDATE RESULT
              reboot_required={{ 'yes' if solari_apt_marker.stat.exists
              or solari_apt_apply.stdout | default('') is search('Setting up (linux-image|libc6|systemd[: ]|raspi-firmware)')
              else 'no' }}
          when: solari_update_mode == 'apply'

    - name: SUSE family
      when: ansible_facts['os_family'] == 'Suse'
      vars:
        # A rolling release moves by distribution upgrade; `zypper update` is not supported on it.
        solari_zypper_verb: "{{ 'dup --auto-agree-with-licenses' if 'Tumbleweed' in ansible_facts['distribution'] else 'update --auto-agree-with-licenses' }}"
      block:
        - name: Refresh the repositories
          ansible.builtin.command: zypper --non-interactive --quiet refresh
          changed_when: false
          failed_when: false

        - name: Simulate the upgrade
          ansible.builtin.command: "zypper --non-interactive --no-color {{ solari_zypper_verb }} --dry-run"
          register: solari_zypper_pending
          changed_when: false
          failed_when: solari_zypper_pending.rc not in [0, 100, 101, 102, 103, 106]

        - name: Report pending packages
          ansible.builtin.debug:
            msg: >-
              SOLARI_UPDATE PENDING
              count={{ solari_zypper_pending.stdout | regex_search('([0-9]+) packages? to upgrade', '\1') | default(['0'], true) | first }}
              new={{ solari_zypper_pending.stdout | regex_search('([0-9]+) new', '\1') | default(['0'], true) | first }}
              remove={{ solari_zypper_pending.stdout | regex_search('([0-9]+) to remove', '\1') | default(['0'], true) | first }}

        - name: Apply the upgrade
          ansible.builtin.command: "zypper --non-interactive --no-color {{ solari_zypper_verb }}"
          register: solari_zypper_apply
          changed_when: true
          # 103: zypper updated itself and must run again to do the rest. 106: a repository
          # was skipped, so the host is not up to date and must not report as complete.
          until: solari_zypper_apply.rc != 103
          retries: 3
          delay: 5
          failed_when: solari_zypper_apply.rc not in [0, 100, 101, 102]
          when: solari_update_mode == 'apply'

        - name: Ask zypper whether a reboot is needed
          ansible.builtin.command: zypper needs-rebooting
          register: solari_zypper_reboot
          changed_when: false
          failed_when: false
          when: solari_update_mode == 'apply'

        - name: Report the result
          ansible.builtin.debug:
            msg: "SOLARI_UPDATE RESULT reboot_required={{ 'yes' if solari_zypper_reboot.rc == 102 or solari_zypper_apply.rc == 102 else 'no' }}"
          when: solari_update_mode == 'apply'
