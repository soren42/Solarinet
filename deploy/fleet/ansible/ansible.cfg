# SolariNet Fleet Provisioning - Ansible defaults.
#
# This file is read when ansible/ansible-playbook run with this directory as the
# current working directory (Ansible searches ./ansible.cfg first). The whole
# tree is rsync'd to /srv/solari-provision/ansible/ on the control node
# (host `benzene`, openSUSE) and executed there.
#
# Provisioning targets are *fresh* machines whose host keys we have not seen
# yet, so host key checking is disabled here deliberately. Do NOT copy this cfg
# onto long-lived management hosts where TOFU host-key pinning matters.

[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
# The `yaml` callback left ansible-core (community.general) and aborts the run
# on ansible-core >= 2.13 without it; the built-in default callback renders
# YAML itself. Ad-hoc probes that parse output pin result_format=json.
stdout_callback        = ansible.builtin.default
callback_result_format = yaml
# Show task timing so slow package installs on arm32/Pi targets are visible.
# These live in the ansible.posix collection; without it Ansible only warns.
callbacks_enabled    = ansible.posix.timer, ansible.posix.profile_tasks
# Fresh installs are usually reached by IP over a short-lived provisioning link;
# fail fast rather than hanging the whole run.
timeout              = 30
interpreter_python   = auto_silent
force_valid_group_names = ignore

[ssh_connection]
# Pipelining is a large speedup and is safe because sudoers on our images does
# not enable `requiretty`. ControlPersist keeps the SSH master alive between
# tasks so the many-task base-os role does not reconnect repeatedly.
pipelining      = True
ssh_args        = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey,password

[privilege_escalation]
become        = True
become_method = sudo
