---
- name: Require a supported DNS host family
  ansible.builtin.assert:
    that: ansible_os_family in ['Suse', 'Debian']
    fail_msg: dns-secondary supports openSUSE and Debian hosts only

- name: Require an admin account when scoped sudo access is enabled
  ansible.builtin.assert:
    that:
      - not dns_secondary_manage_sudoers | bool or (dns_secondary_admin_user is match('^[A-Za-z_][A-Za-z0-9_-]*$'))
    fail_msg: dns_secondary_admin_user must be set when dns_secondary_manage_sudoers is true

- name: Select SUSE paths and service
  ansible.builtin.set_fact:
    dns_secondary_package: bind
    dns_secondary_service: named
    dns_secondary_main_conf: "{{ dns_secondary_suse_main_conf }}"
    dns_secondary_conf_dir: "{{ dns_secondary_suse_conf_dir }}"
    dns_secondary_data_dir: "{{ dns_secondary_suse_data_dir }}"
    dns_secondary_named_user: named
    dns_secondary_checkconf: /usr/bin/named-checkconf
  when: ansible_os_family == 'Suse'

- name: Select Debian paths and service
  ansible.builtin.set_fact:
    dns_secondary_package: bind9
    dns_secondary_service: bind9
    dns_secondary_main_conf: /etc/bind/named.conf
    dns_secondary_conf_dir: "{{ dns_secondary_debian_conf_dir }}"
    dns_secondary_data_dir: "{{ dns_secondary_debian_data_dir }}"
    dns_secondary_named_user: bind
    dns_secondary_checkconf: /usr/sbin/named-checkconf
  when: ansible_os_family == 'Debian'

- name: Install BIND
  ansible.builtin.package:
    name: "{{ dns_secondary_package }}"
    state: present

- name: Ensure Debian rndc key exists
  ansible.builtin.command: /usr/sbin/rndc-confgen -a -c /etc/bind/rndc.key
  args:
    creates: /etc/bind/rndc.key
  when: ansible_os_family == 'Debian'

- name: Create secondary configuration and data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ dns_secondary_conf_dir }}", owner: root, group: root, mode: '0755' }
    - { path: "{{ dns_secondary_data_dir }}", owner: "{{ dns_secondary_named_user }}", group: "{{ dns_secondary_named_user }}", mode: '0750' }

- name: Install authoritative-only BIND configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
    validate: "{{ dns_secondary_checkconf }} %s"
  loop:
    - { src: options.conf.j2, dest: "{{ dns_secondary_conf_dir }}/options.conf" }
    - { src: zones.conf.j2, dest: "{{ dns_secondary_conf_dir }}/zones.conf" }
    - { src: named.conf.j2, dest: "{{ dns_secondary_main_conf }}" }
  notify:
    - Validate secondary BIND configuration
    - Reload secondary BIND

- name: Install privileged zone update helper
  ansible.builtin.template:
    src: update-zones.py.j2
    dest: "{{ dns_secondary_update_helper }}"
    owner: root
    group: root
    mode: '0755'

- name: Configure narrowly scoped update sudo access
  ansible.builtin.template:
    src: sudoers.j2
    dest: "{{ dns_secondary_sudoers_file }}"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
  when: dns_secondary_manage_sudoers | bool

- name: Remove update sudo access when disabled
  ansible.builtin.file:
    path: "{{ dns_secondary_sudoers_file }}"
    state: absent
  when: not dns_secondary_manage_sudoers | bool

- name: Ensure authoritative secondary is enabled and running
  ansible.builtin.systemd:
    name: "{{ dns_secondary_service }}.service"
    enabled: true
    state: started

- name: Read service facts for firewall decision
  ansible.builtin.service_facts:

- name: Check whether firewalld has DNS permanently enabled
  ansible.builtin.command: firewall-cmd --permanent --query-service=dns
  check_mode: false
  register: dns_secondary_firewalld_permanent
  changed_when: false
  failed_when: dns_secondary_firewalld_permanent.rc not in [0, 1]
  when: "'firewalld.service' in ansible_facts.services and ansible_facts.services['firewalld.service'].state == 'running'"

- name: Check whether firewalld has DNS enabled in the running configuration
  ansible.builtin.command: firewall-cmd --query-service=dns
  check_mode: false
  register: dns_secondary_firewalld_runtime
  changed_when: false
  failed_when: dns_secondary_firewalld_runtime.rc not in [0, 1]
  when: "'firewalld.service' in ansible_facts.services and ansible_facts.services['firewalld.service'].state == 'running'"

- name: Enable DNS in firewalld permanently
  ansible.builtin.command: firewall-cmd --permanent --add-service=dns
  changed_when: true
  when:
    - "'firewalld.service' in ansible_facts.services and ansible_facts.services['firewalld.service'].state == 'running'"
    - dns_secondary_firewalld_permanent.rc == 1

- name: Enable DNS in firewalld immediately
  ansible.builtin.command: firewall-cmd --add-service=dns
  changed_when: true
  when:
    - "'firewalld.service' in ansible_facts.services and ansible_facts.services['firewalld.service'].state == 'running'"
    - dns_secondary_firewalld_runtime.rc == 1
