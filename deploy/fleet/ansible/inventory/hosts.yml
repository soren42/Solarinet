# SolariNet Fleet Provisioning - example inventory.
#
# Two orthogonal groupings are maintained:
#
#   1. Distro family     -> selects the correct package NAMES via solari_pkg_map
#                           (see group_vars/all.yml). Ansible also auto-detects
#                           `ansible_os_family` at runtime; these static groups
#                           exist so you can target a family with --limit and so
#                           you can hang family-specific group_vars off them.
#   2. Role (client/...)  -> selects what SolariNet software gets enrolled.
#
# A host may live in one family group and one (or more) role groups at once via
# YAML anchors is NOT used here; instead we use the `children` mechanism so a
# host listed under `solari_clients` can also be listed under `debian`.
#
# DASHBOARD-DRIVEN FLOW
# ---------------------
# The SolariNet dashboard provisions a fresh box by writing a small per-host
# YAML file into inventory/host_vars/<name>.yml (or by appending a host entry
# here) carrying the per-host facts it knows: ansible_host (the IP it reached
# on the provisioning link), the target hostname, the enrollment material paths
# on the control node, and the server URL. Everything else is inherited from
# group_vars/all.yml so the "same stack everywhere" contract holds. See the
# commented `pi-porch` example below for the exact shape.

all:
  children:

    # ---- Distro-family groups (drive package-name mapping) ----------------
    debian:
      hosts:
        # Bare Debian target reached over the provisioning link.
        deb-sample:
          ansible_host: 192.0.2.11

    ubuntu:
      hosts:
        ubu-sample:
          ansible_host: 192.0.2.12

    suse:
      hosts:
        suse-sample:
          ansible_host: 192.0.2.13

    # ---- Role groups (drive which SolariNet agent is enrolled) -----------
    solari_clients:
      # Hosts that should run the SolariNet monitoring client.
      hosts:
        deb-sample:
        ubu-sample:
        suse-sample:

    # ---- Fully-worked per-host example (what the dashboard emits) ---------
    # Uncomment to see the complete set of per-host vars the dashboard injects.
    # A Raspberry Pi (Raspberry Pi OS = Debian family, arm architecture):
    #
    # provisioned:
    #   hosts:
    #     pi-porch:
    #       ansible_host: 192.0.2.50          # IP on the provisioning link
    #       ansible_user: pi                  # image's default bootstrap user
    #       solari_hostname: pi-porch         # final hostname to set
    #       solari_server_url: tls+tcp://solari.example.intranet:7701
    #       solari_op: dashboard              # operator id recorded at enroll
    #       solari_server_name: solari.example.intranet
    #       solari_server_ip: 192.0.2.1       # pinned in /etc/hosts (DNS-SAN fix)
    #       # Control-node paths to enrollment material produced out-of-band:
    #       solari_client_bin_src: /srv/solari-provision/artifacts/arm/solariClient
    #       solari_ca_src:   /srv/solari-provision/enroll/pi-porch/ca.pem
    #       solari_cert_src: /srv/solari-provision/enroll/pi-porch/node.pem
    #       solari_key_src:  /srv/solari-provision/enroll/pi-porch/node.key
