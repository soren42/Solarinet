# nmap_enrich — active-recon (nmap) intel enricher config (sample).
#
# Copy to nmap_enrich.conf (gitignored — it may hold the DB password) and
# edit. INI format, read with Python's configparser — same [db] shape as
# oui_enrich.conf.example / avahi_import.conf.example / mdns_inspect.conf.example.
#
#   cp deploy/discovery/nmap_enrich.conf.example deploy/discovery/nmap_enrich.conf
#   chmod 600 deploy/discovery/nmap_enrich.conf

[db]
# The xenon `solarinet` MariaDB (server-local). Leave `password` blank (or a
# CHANGE_ME placeholder) to source it from $SOLARI_DB_PASS instead — e.g. by
# `source run/db.env` before running, same convention as
# deploy/discovery/oui_enrich.conf.example.
host = 127.0.0.1
port = 3306
user = solari
name = solarinet
password =
