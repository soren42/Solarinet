options {
    directory "/var/cache/bind/solarinet-secondary";
    listen-on port 53 { 10.7.0.10; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { 10.0.0.0/8; localhost; };
    allow-transfer { none; };
    response-policy { zone "rpz.akoria"; };
    dnssec-validation no;
    minimal-responses yes;
};
