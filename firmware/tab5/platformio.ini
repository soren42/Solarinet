; SolariNet — M5Stack Tab5 (ESP32-P4) security/ops companion
; ---------------------------------------------------------------------------
; The Tab5 is an ESP32-P4 (dual-core RISC-V, no native radio). Wi-Fi/BT is
; provided by an on-board ESP32-C6 co-processor reached over SDIO using the
; esp_wifi_remote / esp-hosted transport. The Arduino WiFi API works through
; that shim, so application code uses <WiFi.h> as usual.
;
; NOTE (toolchain): mainline PlatformIO's `espressif32` platform did not ship
; ESP32-P4 support at the time this scaffold was written. Use the community
; "pioarduino" fork, which tracks Arduino-ESP32 3.x + IDF 5.3/5.4 and has P4 +
; Tab5 board defs. If your installed platform already carries `esp32-p4`/
; `m5stack-tab5`, you can drop the explicit `platform =` URL.
; TODO(build-host): pin these to the exact versions available on the flashing
; host and re-resolve the M5 board id (see README "Flashing").

[platformio]
default_envs = tab5
src_dir = src

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.20
; TODO(board): confirm on the build host. Candidates seen in the wild:
;   m5stack-tab5   (M5 board def, preferred if present)
;   esp32-p4-evboard / esp32p4  (generic P4 fallback — then set board_build.*)
board = m5stack-tab5
framework = arduino

monitor_speed = 115200
upload_speed = 1500000
; USB-C on the Tab5 enumerates as a USB-Serial/JTAG (native ESP32-P4 USB).
; esptool auto-detects the port; set upload_port if you have several boards.
; upload_port = /dev/ttyACM0

board_build.mcu = esp32p4
board_build.f_cpu = 360000000L
; 16 MB flash on the Tab5. Custom partition table reserves an encrypted NVS
; partition for secrets (TOTP seeds, PM key material) — see partitions.csv.
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    ; M5GFX targets the Tab5 panel/touch; keep in sync with the board id above.
    -DM5GFX_BOARD=board_M5Tab5
    ; App feature flags — flip in a *local* build, never commit real secrets.
    -DSOLARI_APP_NAME=\"SolariNet\ Companion\"
    ; Set to 1 only if this SKU has the MIPI-CSI camera populated (QR add-seed).
    ; TODO(hardware): confirm camera presence — see README "Open questions".
    -DSOLARI_HAS_CAMERA=0

lib_deps =
    m5stack/M5Unified @ ^0.2.5
    m5stack/M5GFX @ ^0.2.6
    ; MQTT client for the SolariNet notification surface (see notify.cpp).
    knolleary/PubSubClient @ ^2.8
    ; JSON for notify payloads + Vaultwarden/Bitwarden API responses.
    bblanchon/ArduinoJson @ ^7.1.0
    ; TOTP: no external lib required — totp.cpp computes HMAC-SHA1 with mbedTLS
    ; (bundled in the IDF) and includes its own Base32 decoder. If you prefer a
    ; ready-made lib instead, `robtillaart/Base32` + a TOTP helper also work.
    ; NOTE: Bitwarden crypto (PBKDF2/Argon2id + AES-CBC + HMAC-SHA256) is done
    ; with mbedTLS, which ships inside the IDF — no extra lib. Argon2 may need
    ; the IDF component `mbedtls` built with PSA, or the `argon2` component.

; ---------------------------------------------------------------------------
; Secrets are NOT baked into the firmware. Provisioning happens at runtime
; over a first-boot setup flow (Wi-Fi + server URLs + master password), stored
; in the encrypted NVS partition. See DESIGN.md "Security model".
; For developer convenience you MAY create src/secrets.local.h (gitignored)
; and guard it with #if __has_include(...) — never commit it.
; ---------------------------------------------------------------------------
